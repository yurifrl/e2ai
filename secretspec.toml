# SecretSpec manifest — declarations only; VALUES live in 1Password
# (vault "SRE Team", item "e2ai"). Resolve with the 1Password desktop app
# (or OP_SERVICE_ACCOUNT_TOKEN in CI): `brew install secretspec`.
#
# `secretspec check` must pass before anything runs; `secretspec run -- <cmd>`
# injects the resolved environment. Personal overrides still win: the
# api sources .env.$USER.local AFTER the injected env (later layers override).
# The e2ai-env k8s Secret (local/env-to-secret.sh) keeps sourcing the layer
# files, so a real environment still declares its overlay in .env.$ENV.

[project]
name = "e2ai"
revision = "1.0"

[providers]
sre = "onepassword://nsx-team.1password.com@SRE Team"

[profiles.default.defaults]
providers = ["sre"]

# ===== 1Password-backed secrets (item e2ai) =====
[profiles.default]
GITHUB_TOKEN = { description = "GitHub REST token — reconcile sweep, plan sync, PR comments", required = true, ref = { item = "e2ai", field = "github_pat" } }
WEBHOOK_SECRET = { description = "Shared fallback for registry webhook_secret_ref op:// refs; also signs local webhook:simulate deliveries", required = true, ref = { item = "e2ai", field = "github_webhook_secret" } }
E2AI_RUNNER_SERVICE_TOKEN = { description = "Service token gating the MCP surface and runner lifecycle endpoints", required = true, ref = { item = "e2ai", field = "runner_service_token" } }
AIHUB_BASE_URL = { description = "aihub gateway base URL the agentrunner talks to", required = true, ref = { item = "e2ai", field = "aihub_base_url" } }
AIHUB_API_TOKEN = { description = "aihub gateway token — agent-scoped credential (SAFE-01)", required = true, ref = { item = "e2ai", field = "aihub_gateway_token" } }

# ===== non-secret local config (code defaults + these) =====
DEV_FALLBACK_USER = { description = "Local-only BFF identity; never set in staging/prod", default = "you@example.com" }
E2AI_ARTIFACTS_DIR = { description = "Artifact volume the api serves under /artifacts", default = "/tmp/e2ai/artifacts" }
E2AI_REPORT_BASE_URL = { description = "Public admin origin sticky comments link to", default = "http://localhost:8080/e2ai" }
E2AI_REPORT_LINK_SECRET = { description = "HMAC key signing report/artifact links (?e2ai=); dev value, not a secret", default = "dev-link-secret" }
